spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  datasource:
    url: jdbc:mysql://localhost:3306/sql_queries
    username: root
    password: root
  jpa.hibernate.ddl-auto: update
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: service-a
              uri: lb://service-a
              # uri: http://localhost:1234
              predicates:
                - Path=/service-a/**
              filters:
                # - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/test

            - id: service-b
              uri: lb://service-b
              # uri: http://localhost:1235
              predicates:
                - Path=/service-b/**
              filters:  
                - StripPrefix=1

            - id: service-c
              uri: lb://service-c
              # uri: http://localhost:1236
              predicates:
                - Path=/service-c/**
              filters:
                - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: '*'

resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 1s
        permittedNumberOfCallsInHalfOpenState: 2