spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  datasource:
    url: jdbc:mysql://localhost:3306/sql_queries
    username: root
    password: root
  jpa.hibernate.ddl-auto: update
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8081